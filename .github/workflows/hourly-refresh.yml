# 每小時叫醒雲端上的 App 更新新聞與訊號。
# 免費方案的主機沒人使用時會休眠，App 內建的排程就不會執行，所以改由 GitHub 定時呼叫。
#
# 啟用方式：GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#   APP_URL      你的網址，例如 https://stock-tracker-xxxx.onrender.com（結尾不要加 /）
#   CRON_SECRET  跟雲端主機上的 CRON_SECRET 相同
# 沒設定這兩個 secret 時，這個 workflow 會自動跳過，不會失敗。
name: Hourly news refresh

on:
  schedule:
    - cron: "7 * * * *"   # 每小時第 7 分鐘（UTC）；GitHub 的排程可能會延遲幾分鐘
  workflow_dispatch: {}   # 也可以在 Actions 頁面手動按「Run workflow」

permissions: {}           # 資安：這個 workflow 不需要任何 GitHub 權限

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Call refresh endpoint
        if: ${{ env.APP_URL != '' && env.CRON_SECRET != '' }}
        run: |
          # 主機休眠中會需要幾十秒啟動，所以允許較長的等待並重試
          curl --fail-with-body --silent --show-error --max-time 600 \
               --retry 2 --retry-all-errors --retry-delay 30 \
               -X POST "$APP_URL/api/jobs/refresh-news" \
               -H "X-Cron-Secret: $CRON_SECRET"
